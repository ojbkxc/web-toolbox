<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Web 工具箱</title>
<style>
  * { box-sizing: border-box; }
  /* 焦点可见性: 全项目零 outline:none, 原生 focus ring 保留——键盘用户能看见焦点在哪。
     条目/tab 是浅色背景, 原生 outline 可见; 不加自定义 :focus 样式(原生够用),
     约定: 任何"觉得 outline 丑"的样式微调都不许删 outline, 键盘用户失焦是可达性事故。 */
  body { font: 12px/1.5 system-ui, "Microsoft YaHei", sans-serif; margin: 0; color: #222; background: #fff; height: 100vh; display: flex; flex-direction: column; }
  button { font-family: inherit; }

  /* 顶栏 */
  .hd { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #eee; background: #fafbfc; }
  .hd .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#1a73e8,#0d47a1); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .hd .name { font-size: 13px; font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700; letter-spacing: .5px; }
  .badge.idle { background: #f1f3f4; color: #5f6368; }
  .badge.rec { background: #fce8e6; color: #d93025; }
  .badge.pause { background: #fef7e0; color: #b06000; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.rec .dot { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:.25;} 100%{opacity:1;} }
  .hd .sp { flex: 1; }
  .ctl { display: flex; gap: 4px; }
  .ctl button { border: 1px solid #dadce0; background: #fff; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .ctl button:hover { background: #f1f3f4; }
  .ctl button.primary { background: #d93025; border-color: #d93025; color: #fff; }
  .ctl button.primary:hover { opacity: .9; }
  .ctl button:disabled { opacity: .45; cursor: default; }

  /* Tab 条 */
  .tabs { display: flex; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid #eee; }
  .tab { border: none; background: none; padding: 6px 12px; font-size: 12px; font-weight: 600; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .tab .n { color: #1a73e8; font-size: 11px; }

  .pages { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .page { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .page.active { display: flex; }

  /* 录制页 */
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .filterbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
  .filterbar input { margin: 0; flex: 1; font-size: 11px; padding: 4px 7px; }
  .filterbar .fn { font-size: 10px; color: #999; white-space: nowrap; }
  .list { flex: 1; min-height: 0; overflow-y: auto; border-bottom: 1px solid #f0f0f0; }
  .req { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-bottom: 1px solid #f6f6f6; cursor: pointer; }
  .req:hover { background: #f5f8ff; }
  .req.sel { background: #e8f0fe; }
  .req .m { font-weight: 700; width: 46px; flex-shrink: 0; font-size: 11px; }
  .req .m.GET { color: #188038; }
  .req .m.POST { color: #d93025; }
  .req .m.PUT, .req .m.DELETE { color: #b06000; }
  .req .u { color: #555; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req .st { color: #999; font-size: 11px; flex-shrink: 0; }
  .req .st.s2 { color: #188038; }
  .req .st.s4 { color: #b06000; font-weight: 700; }
  .req .st.s5 { color: #d93025; font-weight: 700; }
  .req .dur { color: #bbb; font-size: 10px; flex-shrink: 0; }
  .req .dur.mid { color: #b06000; }
  .req .dur.slow { color: #d93025; font-weight: 700; }
  .req .dyn { color: #b06000; font-size: 10px; flex-shrink: 0; }
  .empty { color: #aaa; text-align: center; padding: 24px 12px; font-size: 12px; }

  .detail { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px; background: #fbfbfb; }
  .kv { margin-bottom: 10px; }
  .kv h4 { margin: 0 0 3px; font-size: 10px; color: #999; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .kv pre { margin: 0; background: #fff; border: 1px solid #eee; padding: 6px; border-radius: 4px; font: 11px/1.45 Consolas, monospace; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; }
  textarea { width: 100%; min-height: 64px; font: 11px/1.45 Consolas, monospace; border: 1px solid #ccc; border-radius: 4px; padding: 5px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .btn { padding: 4px 10px; border: 1px solid #dadce0; border-radius: 5px; background: #fff; cursor: pointer; font-size: 11px; font-weight: 600; }
  .btn:hover { background: #f1f3f4; }
  .btn.pri { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  .btn.pri:hover { opacity: .9; }
  .btn.warn { background: #d93025; border-color: #d93025; color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .badge-txt { font-size: 11px; color: #888; }

  /* 导出页 */
  .exp { flex: 1; overflow-y: auto; padding: 12px; }
  .wz-fmts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .wz-fmt { border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 9px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .wz-fmt.checked { border-color: #1a73e8; background: #f0f6ff; }
  .wz-fmt input { accent-color: #1a73e8; }
  .wz-fmt .t { font-size: 12px; font-weight: 600; }
  .wz-fmt .s { font-size: 10px; color: #888; }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .status { font-size: 12px; text-align: center; margin: 8px 0; }
  .exp-out { font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-all; background: #f8f9fa; border: 1px solid #eee; border-radius: 6px; padding: 8px; margin-top: 8px; display: none; }
  .exp-out .hd2 { color: #1a73e8; font-weight: 700; }
  .exp-out .err { color: #d93025; }
  .status.ok { color: #188038; }
  .status.err { color: #d93025; }
  .badge-txt.err { color: #d93025; }
  .hint { color: #888; font-size: 11px; margin: 6px 0; line-height: 1.6; }

  /* Cookie 页 */
  .cookie { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px; }
  .ckbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .ckbtn { padding: 5px 8px; border: 1px solid #ccc; border-radius: 5px; background: #fff; font-size: 11px; cursor: pointer; }
  .ckbtn:hover { background: #f5f5f5; }
  .ckbtn:disabled { opacity: .45; cursor: default; }
  .ckbtn.pri { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  input[type=text] { width: 100%; padding: 5px 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  td { padding: 2px 4px; border-bottom: 1px solid #f5f5f5; word-break: break-all; }
  td.n { color: #555; white-space: nowrap; }
  .ck-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .status2 { font-size: 11px; margin: 0 0 6px; }
  .status2.ok { color: #188038; }
</style>
</head>
<body>
  <div class="hd">
    <span class="logo">W</span>
    <span class="name">Web 工具箱</span>
    <span class="badge idle" id="stBadge"><span class="dot"></span><span id="stLabel">IDLE</span></span>
    <span class="sp"></span>
    <div class="ctl" id="ctl">
      <button class="primary" id="btnStart">● Record</button>
      <button id="btnPause" style="display:none">⏸ Pause</button>
      <button id="btnResume" style="display:none">▶ Resume</button>
      <button id="btnRerecord" style="display:none" title="停止当前录制、丢弃已录数据、立即开始新一轮(需确认)">↻ 重录</button>
      <button class="warn" id="btnStop" style="display:none">■ Stop</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="工具箱页面">
    <!-- aria-controls 单向关联(tab→面板): tabpanel 用静态 aria-label 命名而非 aria-labelledby 指回 tab ——
         tab 文案含计数徽章("录制 12"), labelledby 会把数字读进页面名; arrow 键盘契约见 JS keydown -->
    <button class="tab active" role="tab" aria-selected="true" aria-controls="pgRec" data-tab="rec">录制<span class="n" id="tabRecN"></span></button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="pgExp" data-tab="exp">导出</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="pgCk" data-tab="ck">Cookie<span class="n" id="ckCount">0</span></button>
  </div>

  <div class="pages">
    <!-- 录制页 -->
    <div class="page active" id="pgRec" role="tabpanel" aria-label="录制">
      <div class="main">
        <div class="filterbar">
          <input type="text" id="q" placeholder="🔍 过滤: POST / >=400 / /web/" aria-label="过滤录制列表, 支持方法名/状态码/路径关键词">
          <span class="fn" id="visN"></span>
          <button class="btn" id="btnPick" title="勾选模式: 框选条目后导出/关联/AI 只作用于勾选集(优先于过滤)" style="font-size:11px;padding:3px 7px">☐ 勾选</button>
          <button class="btn" id="btnPickAll" title="勾选模式下: 可见集全选/再点全取消" style="font-size:11px;padding:3px 7px;display:none">全选</button>
          <button class="btn" id="btnClean" title="移除可见集里的预检/静态资源/重复请求" style="font-size:11px;padding:3px 7px">✂ 清洗</button>
        </div>
        <div class="list" id="list"><div class="empty">暂无录制。<br>点上方 ● Record 开始。</div></div>
        <!-- detailAnn: 选中条目后播报"已选中 X 状态 N"(读屏用户焦点在列表条目上,
             详情区更新本身无播报); off-screen(sr-only)纯播报不占视觉 -->
        <div id="detailAnn" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
        <div class="detail" id="detail"><div class="empty">← 点一条请求看详情</div></div>
        <div class="acts" style="padding:6px 10px;border-top:1px solid #eee;gap:6px">
          <button class="btn pri" id="btnReplayChain" title="按顺序重放当前导出集, 响应 vs 录制自动 diff">▶ 链路重放</button>
          <button class="btn" id="btnChainAiDiag" title="把重放失败/差异的请求喂给 AI, 给修复建议" style="display:none">🤖 调试失败</button>
          <button class="btn" id="btnAiAssert" title="为当前导出集生成业务断言(AI), 重放时用断言判定成败而非文本 diff">🧪 断言</button>
          <span class="badge-txt" id="chainMsg" role="status" aria-live="polite"></span>
        </div>
        <!-- aria-live 不挂 chainOut: 逐条 appendChild 会让读屏每条播报一次(30 条=30 次轰炸);
             进度反馈归 chainMsg(已挂 polite, onProgress 每条更新"第 i/N 条"——polite 队列里旧值被新值顶掉,
             读屏只听到节流后的最新进度), 全量明细是视觉回查材料不播报 -->
        <div id="chainOut" style="display:none;border-top:1px solid #eee;max-height:220px;overflow-y:auto;background:#f8f9fa;font:11px/1.5 Consolas,monospace;padding:6px 10px"></div>
      </div>
    </div>

    <!-- 导出页 -->
    <div class="page" id="pgExp" role="tabpanel" aria-label="导出">
      <div class="exp">
        <div class="hint" id="expScope">已录 <b id="expCount">0</b> 条 · 可见 <b id="visCount">0</b> 条 → 导出/关联/AI 取<b>可见集</b>。格式:</div>
        <div class="wz-fmts">
          <label class="wz-fmt checked" data-fmt="jsonl"><input type="checkbox" id="fmtJsonl" checked><div><div class="t">JSONL</div><div class="s">喂 AI / 工具链</div></div></label>
          <label class="wz-fmt" data-fmt="har"><input type="checkbox" id="fmtHar"><div><div class="t">HAR</div><div class="s">通用流量格式</div></div></label>
          <label class="wz-fmt checked" data-fmt="jmx"><input type="checkbox" id="fmtJmx" checked><div><div class="t">JMeter</div><div class="s">.jmx 压测</div></div></label>
          <label class="wz-fmt" data-fmt="py"><input type="checkbox" id="fmtPy"><div><div class="t">Python</div><div class="s">requests 脚本</div></div></label>
        </div>
        <div class="hint" id="preludeHint" style="display:none" title="登录前置请求: JMX 里包进「仅一次控制器」每线程只登录一次; 可在录制列表手动勾改前置标记">
          识别到 <b id="preludeCount">0</b> 条登录前置。
          <label style="margin-left:6px"><input type="checkbox" id="optOnceOnly" checked> 仅登录一次</label>
          <label style="margin-left:10px" title="会话失效后下一轮循环自动重登(实验)"><input type="checkbox" id="optAutoRelogin"> 失效重登</label>
        </div>
        <div class="hint" id="trimHint" style="display:none" title="只导出选中条目起的部分, 之前的请求(如登录探索过程)被裁掉">
          从 <b id="trimFrom"></b> 开始导出。<span id="trimNote" style="color:#c8871a"></span>
          <label style="margin-left:6px"><input type="checkbox" id="optTrim" checked> 起点</label>
        </div>
        <div class="hint" id="csvHint" style="display:none" title="把依赖链变量(单号/ID 等跨接口传递值)生成 CSV 数据驱动文件: 表头=变量, 首行=录制值。用户往 CSV 加多行, JMeter 每循环逐行取数。对标手写 KTKI 压测脚本的 SPM_TIKT_UAT.csv 姿势。">
          数据驱动: <b id="csvCount">0</b> 个链变量可参数化
          <label style="margin-left:6px"><input type="checkbox" id="optCsv" checked> 生成 data.csv + 引用</label>
          <span style="color:#888">(CSV 文件与 .jmx 一起导出, 放同目录; 无 CSV 也能跑, 用录制值兜底)</span>
        </div>
        <div class="row">
          <button class="btn pri" id="btnSave" title="按勾选格式导出到浏览器下载目录">💾 保存</button>
          <button class="btn" id="btnDiscard" title="清空全部录制(不可恢复)">🗑 丢弃</button>
          <button class="btn" id="btnAiReport" title="AI 分析当前导出集, 输出流量报告(Markdown)">🤖 报告</button>
          <button class="btn" id="btnAiChain" title="AI 找跨接口参数传递(如 A 的 orderId 是 B 的入参), 重放/JMX 自动注入; 已有链时点击查看明细">🔗 建链</button>
          <button class="btn" id="btnAiDoc" title="AI 生成接口文档(Markdown)">📄 文档</button>
          <button class="btn" id="btnCorrelate" title="同接口录 2+ 次 → diff 出动态值(时间戳/序号)并参数化, JMX 自动应用">⚡ 关联</button>
          <button class="btn" id="btnConfig" title="打开配置页: 域名授权 / AI 接口">⚙ 配置</button>
          <button class="btn" id="btnDiagLog" title="导出引擎诊断日志(attach/写入失败/配额裁剪等, 不含请求数据)">📋 日志</button>
        </div>
        <div class="row" style="align-items:center">
          <label style="font-size:11px;color:#888;white-space:nowrap" title="全部 AI 技能: 基础(报告/建链/文档/断言/诊断) + 进阶(冒烟解读/契约判定/接口清单/敏感扫描/会话特征)">🤖 技能</label>
          <select id="skillSel" title="选择要执行的 AI 技能(下拉里各选项的悬停提示有完整描述)" style="flex:1;min-width:0;padding:4px 7px;border:1px solid #ccc;border-radius:4px;font-size:11px"></select>
          <button class="btn pri" id="btnRunSkill" title="用选中的技能分析当前导出集(勾选优先, 否则可见集)">▶ 执行</button>
        </div>
        <div class="status" id="expMsg" role="status" aria-live="polite"></div>
        <!-- expOut 不挂 aria-live: 内容是 AI 报告全文(可达数 KB), 挂 live 读屏会整篇播报轰炸;
             完成信号归上方 expMsg(已挂 polite, "✓ 完成 · N 条"先播), 视觉回查材料不播报
             (与 chainOut 同一取舍, v1.0.47)。 -->
        <div class="exp-out" id="expOut" role="region" aria-label="导出/AI 结果预览"></div>
      </div>
    </div>

    <!-- Cookie 页 -->
    <div class="page" id="pgCk" role="tabpanel" aria-label="Cookie">
      <div class="cookie">
        <div class="ckbtns">
          <button class="ckbtn pri" id="expState" title="Playwright storage_state 格式(含 httpOnly, 配合 PY 脚本/工具链)">⬇ state</button>
          <button class="ckbtn" id="copyState" title="复制 state JSON 到剪贴板">📋 state</button>
          <button class="ckbtn" id="expCurl" title="Cookie 请求头一行(Cookie: k=v; …)">⬇ curl 串</button>
          <button class="ckbtn" id="copyCurl" title="复制 Cookie 头字符串">📋 Cookie 串</button>
          <button class="ckbtn" id="expRaw" title="chrome.cookies 原始对象数组">⬇ 原始</button>
        </div>
        <div class="status2" id="ckMsg" role="status" aria-live="polite"></div>
        <input type="text" id="search" placeholder="搜 Cookie 名" aria-label="按 Cookie 名搜索">
        <div class="ck-scroll"><table id="tbl"></table></div>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script src="../auth.js"></script>
  <script src="../correlate.js"></script>
  <script src="../replay.js"></script>
  <script src="../jmx.js"></script>
  <script src="../pyscript.js"></script>
  <script src="../aireport.js"></script>
  <script src="../skill.js"></script>
  <script src="../aic.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
